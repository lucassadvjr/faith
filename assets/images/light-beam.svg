<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="lightSource" cx="50%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#FBF0D2" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#D6B56A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="mainBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#D6B56A" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#D6B56A" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="diagonalRayLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DB" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#D6B56A" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="diagonalRayRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DB" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#D6B56A" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Ambient Dark Backdrop Glow -->
  <circle cx="250" cy="200" r="190" fill="url(#lightSource)" />

  <!-- Diagonal Piercing Shafts -->
  <polygon points="250,50 30,550 110,600" fill="url(#diagonalRayLeft)" opacity="0.6" />
  <polygon points="250,50 470,550 390,600" fill="url(#diagonalRayRight)" opacity="0.6" />

  <!-- Core Radiant Vertical Shaft -->
  <polygon points="230,40 180,600 320,600 270,40" fill="url(#mainBeam)" opacity="0.85" />
  <polygon points="245,30 220,600 280,600 255,30" fill="#FFFFFF" opacity="0.3" />

  <!-- Geometric Abstract Faith Monolith Silhouette -->
  <g opacity="0.8">
    <!-- Slender vertical cross element subtly embedded in the light -->
    <rect x="247" y="110" width="6" height="280" rx="3" fill="#D6B56A" opacity="0.8" />
    <rect x="215" y="180" width="70" height="6" rx="3" fill="#D6B56A" opacity="0.8" />
    <!-- Floating rings of transcendence -->
    <ellipse cx="250" cy="183" rx="55" ry="12" stroke="#FFF" stroke-width="1" stroke-dasharray="3 4" opacity="0.4" />
    <ellipse cx="250" cy="183" rx="75" ry="16" stroke="#D6B56A" stroke-width="0.8" stroke-dasharray="2 6" opacity="0.3" />
  </g>

  <!-- Sparkles & Light Dust -->
  <circle cx="250" cy="90" r="2" fill="#FFF" opacity="0.9" />
  <circle cx="220" cy="150" r="1.5" fill="#FFEBB8" opacity="0.8" />
  <circle cx="280" cy="170" r="2.5" fill="#FFF" opacity="0.95" />
  <circle cx="235" cy="240" r="1.8" fill="#FFF" opacity="0.75" />
  <circle cx="270" cy="300" r="1.5" fill="#D6B56A" opacity="0.85" />
  <circle cx="210" cy="360" r="2" fill="#FFF" opacity="0.7" />
  <circle cx="290" cy="420" r="1.5" fill="#FFE29E" opacity="0.6" />
</svg>
